<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#06091A" />
  <title>WebVisit Tester</title>
  <style>
    :root {
      --bg-deep: #06091a;
      --bg-navy: #0d1538;
      --bg-violet: #1b1045;
      --cyan: #38bdf8;
      --indigo: #6366f1;
      --purple: #a855f7;
      --emerald: #34d399;
      --amber: #fbbf24;
      --coral: #fb7185;
      --glass-bg: rgba(18, 26, 58, 0.62);
      --glass-elevated: rgba(26, 36, 77, 0.72);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-border-violet: rgba(139, 92, 246, 0.34);
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Plus Jakarta Sans", sans-serif;
      color: var(--text-primary);
      background: linear-gradient(145deg, var(--bg-deep) 0%, var(--bg-navy) 45%, var(--bg-violet) 100%);
      background-attachment: fixed;
      line-height: 1.45;
      overflow-x: hidden;
    }

    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(75px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
    }

    .orb-cyan {
      width: 280px;
      height: 280px;
      top: -60px;
      left: -60px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.55), transparent 70%);
    }

    .orb-purple {
      width: 320px;
      height: 320px;
      top: 30%;
      right: -90px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.5), transparent 70%);
    }

    .app-shell {
      position: relative;
      z-index: 1;
      max-width: 1060px;
      margin: 0 auto;
      padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .glass-panel {
      background: linear-gradient(145deg, var(--glass-elevated), var(--glass-bg));
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 18px 42px rgba(3, 6, 20, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      border-radius: var(--radius-lg);
      padding: 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.24), rgba(168, 85, 247, 0.28));
      border: 1px solid rgba(255, 255, 255, 0.24);
      display: grid;
      place-items: center;
    }

    .brand-title {
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--text-primary);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
    }

    .layout-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    @media (min-width: 860px) {
      .layout-grid {
        grid-template-columns: 400px 1fr;
        align-items: start;
      }
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .url-row {
      display: flex;
      align-items: center;
      background: rgba(6, 9, 26, 0.65);
      border: 1px solid var(--glass-border-violet);
      border-radius: var(--radius-md);
      padding: 2px 10px;
    }

    .url-row:focus-within {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.16);
    }

    .url-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 0.92rem;
      padding: 11px 4px;
      min-height: 44px;
    }

    .url-input::placeholder { color: var(--text-muted); }

    .chip-row {
      display: flex;
      gap: 8px;
    }

    .chip-btn {
      flex: 1;
      min-height: 36px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(6, 9, 26, 0.48);
      color: var(--text-secondary);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .chip-btn.active {
      background: rgba(56, 189, 248, 0.18);
      border-color: rgba(56, 189, 248, 0.55);
      color: var(--cyan);
    }

    .chip-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .error-text {
      font-size: 0.78rem;
      color: var(--coral);
      min-height: 16px;
    }

    .controls-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .scroll-controls-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }

    .btn {
      min-height: 48px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.22);
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 10px;
      text-decoration: none;
      transition: transform 0.15s ease, opacity 0.18s ease;
    }

    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.42; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, var(--cyan), var(--indigo), var(--purple));
      box-shadow: 0 10px 24px rgba(99, 102, 241, 0.35);
    }

    .btn-stop {
      background: rgba(251, 113, 133, 0.16);
      border-color: rgba(251, 113, 133, 0.48);
      color: #fecdd3;
    }

    .btn-scroll-down {
      background: rgba(56, 189, 248, 0.16);
      border-color: rgba(56, 189, 248, 0.45);
      color: #e0f2fe;
      min-height: 44px;
      font-size: 0.78rem;
    }

    .btn-scroll-down.active {
      background: rgba(56, 189, 248, 0.32);
      border-color: var(--cyan);
    }

    .btn-scroll-up {
      background: rgba(168, 85, 247, 0.16);
      border-color: rgba(168, 85, 247, 0.45);
      color: #f3e8ff;
      min-height: 44px;
      font-size: 0.78rem;
    }

    .btn-scroll-up.active {
      background: rgba(168, 85, 247, 0.34);
      border-color: var(--purple);
    }

    .btn-scroll-stop {
      background: rgba(251, 113, 133, 0.16);
      border-color: rgba(251, 113, 133, 0.45);
      color: #fecdd3;
      min-height: 44px;
      font-size: 0.78rem;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-secondary);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      margin-bottom: 6px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: rgba(6, 9, 26, 0.75);
      overflow: hidden;
      margin-bottom: 14px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--cyan), var(--indigo), var(--purple));
      transition: width 0.3s ease;
    }

    .timer-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }

    .num-box {
      background: rgba(6, 9, 26, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-md);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .num-box label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .num-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--cyan);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 1rem;
      font-weight: 700;
      padding: 4px 0;
      outline: none;
    }

    .scroll-section {
      padding: 12px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .scroll-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .scroll-badge {
      font-size: 0.72rem;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(6, 9, 26, 0.55);
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0 2px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .toggle-label {
      font-size: 0.85rem;
      font-weight: 600;
    }

    .toggle-sub {
      font-size: 0.73rem;
      color: var(--text-muted);
    }

    .switch {
      position: relative;
      width: 48px;
      height: 28px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: rgba(6, 9, 26, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      cursor: pointer;
      transition: 0.2s;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: 0.2s;
    }

    .switch input:checked + .slider {
      background: rgba(168, 85, 247, 0.28);
      border-color: var(--purple);
    }

    .switch input:checked + .slider::before {
      transform: translateX(20px);
      background: var(--purple);
    }

    .preview-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .nav-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      min-width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(6, 9, 26, 0.55);
      color: var(--text-primary);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0 10px;
      cursor: pointer;
    }

    .icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-ghost {
      min-height: 40px;
      padding: 0 12px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.42);
      color: var(--text-primary);
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .preview-stage {
      position: relative;
      width: 100%;
      height: 360px;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: rgba(6, 9, 26, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .preview-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
      display: none;
    }

    .preview-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 10px;
      background: radial-gradient(circle at center, rgba(26, 36, 77, 0.52), rgba(6, 9, 26, 0.92));
    }

    .preview-overlay h3 { font-size: 1.02rem; font-weight: 700; }
    .preview-overlay p { font-size: 0.84rem; color: var(--text-secondary); max-width: 340px; }
  </style>
</head>
<body>
  <div class="ambient-orb orb-cyan"></div>
  <div class="ambient-orb orb-purple"></div>

  <main class="app-shell">
    <header class="glass-panel topbar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
        </div>
        <div class="brand-title">WebVisit Tester</div>
      </div>
      <div class="status-pill">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Idle</span>
      </div>
    </header>

    <div class="layout-grid">
      <section class="glass-panel" aria-label="Minimal Testing Controls">
        <div class="field-group">
          <div class="url-row">
            <input
              id="urlInput"
              class="url-input"
              type="url"
              inputmode="url"
              autocomplete="off"
              placeholder="https://example.com"
            />
          </div>
          <div class="chip-row">
            <button type="button" class="chip-btn active" id="btnHttps">https://</button>
            <button type="button" class="chip-btn" id="btnHttp">http://</button>
          </div>
          <div class="error-text" id="urlError" role="alert"></div>
        </div>

        <div class="controls-row">
          <button type="button" class="btn btn-primary" id="startBtn">Start</button>
          <button type="button" class="btn btn-stop" id="stopBtn" disabled>Stop</button>
        </div>

        <div class="progress-meta">
          <span id="liveStatusLabel">Live Status: Idle</span>
          <span id="progressPercentLabel">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="timer-grid">
          <div class="num-box">
            <label for="viewSecInput">Viewing (s)</label>
            <input id="viewSecInput" class="num-input" type="number" min="3" max="300" value="15" />
          </div>
          <div class="num-box">
            <label for="pauseSecInput">Pause (s)</label>
            <input id="pauseSecInput" class="num-input" type="number" min="0" max="120" value="3" />
          </div>
          <div class="num-box">
            <label for="runsInput">Runs</label>
            <input id="runsInput" class="num-input" type="number" min="1" max="50" value="3" />
          </div>
        </div>

        <div class="scroll-section">
          <div class="scroll-header">
            <div>
              <div class="toggle-label">Auto Scroll</div>
              <div class="toggle-sub">Scroll Speed &amp; Preview Container</div>
            </div>
            <span class="scroll-badge" id="scrollStatusBadge">Idle</span>
          </div>

          <div class="scroll-controls-row">
            <button type="button" class="btn btn-scroll-down" id="scrollDownBtn">Scroll Down</button>
            <button type="button" class="btn btn-scroll-up" id="scrollUpBtn">Scroll Up</button>
            <button type="button" class="btn btn-scroll-stop" id="stopScrollBtn" disabled>Stop Scroll</button>
          </div>

          <div class="chip-row" id="scrollSpeedRow">
            <button type="button" class="chip-btn" data-speed="slow">Slow</button>
            <button type="button" class="chip-btn active" data-speed="medium">Medium</button>
            <button type="button" class="chip-btn" data-speed="fast">Fast</button>
          </div>
        </div>

        <div class="toggle-row">
          <div>
            <div class="toggle-label">Auto Next</div>
            <div class="toggle-sub">Automatically advance queued runs</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="autoNextToggle" checked />
            <span class="slider"></span>
          </label>
        </div>
      </section>

      <section class="glass-panel" aria-label="Website Preview">
        <div class="preview-toolbar">
          <div class="nav-actions">
            <button type="button" class="icon-btn" id="backBtn" disabled>Back</button>
            <button type="button" class="icon-btn" id="homeBtn" disabled>Home</button>
            <button type="button" class="icon-btn" id="reloadBtn" disabled>Reload</button>
          </div>
          <a
            id="headerOpenBtn"
            class="btn-ghost"
            href="about:blank"
            target="_blank"
            rel="noopener noreferrer"
          >Open Website</a>
        </div>

        <div class="preview-stage">
          <iframe
            id="previewFrame"
            class="preview-iframe"
            title="Embedded website preview"
            sandbox="allow-scripts allow-forms allow-same-origin"
          ></iframe>

          <div class="preview-overlay" id="previewOverlay">
            <h3 id="overlayTitle">Ready to Test</h3>
            <p id="overlayDesc">Enter an HTTP or HTTPS URL and tap Start.</p>
            <a
              id="overlayOpenBtn"
              class="btn btn-primary"
              href="about:blank"
              target="_blank"
              rel="noopener noreferrer"
              style="display: none; padding: 0 18px;"
            >Open Website</a>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    (() => {
      // Strictly temporary in-memory session state only. No localStorage, IndexedDB, or history logs.
      const urlInput = document.getElementById("urlInput");
      const urlError = document.getElementById("urlError");
      const btnHttps = document.getElementById("btnHttps");
      const btnHttp = document.getElementById("btnHttp");
      const viewSecInput = document.getElementById("viewSecInput");
      const pauseSecInput = document.getElementById("pauseSecInput");
      const runsInput = document.getElementById("runsInput");
      const autoNextToggle = document.getElementById("autoNextToggle");

      const scrollDownBtn = document.getElementById("scrollDownBtn");
      const scrollUpBtn = document.getElementById("scrollUpBtn");
      const stopScrollBtn = document.getElementById("stopScrollBtn");
      const scrollSpeedRow = document.getElementById("scrollSpeedRow");
      const scrollStatusBadge = document.getElementById("scrollStatusBadge");

      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const backBtn = document.getElementById("backBtn");
      const homeBtn = document.getElementById("homeBtn");
      const reloadBtn = document.getElementById("reloadBtn");

      const statusText = document.getElementById("statusText");
      const statusDot = document.getElementById("statusDot");
      const liveStatusLabel = document.getElementById("liveStatusLabel");
      const progressPercentLabel = document.getElementById("progressPercentLabel");
      const progressFill = document.getElementById("progressFill");

      const previewFrame = document.getElementById("previewFrame");
      const previewOverlay = document.getElementById("previewOverlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayDesc = document.getElementById("overlayDesc");
      const overlayOpenBtn = document.getElementById("overlayOpenBtn");
      const headerOpenBtn = document.getElementById("headerOpenBtn");

      // Speeds in pixels per second for smooth requestAnimationFrame scrolling
      const SPEED_PX_PER_SEC = { slow: 65, medium: 160, fast: 320 };

      let session = {
        running: false,
        currentRun: 0,
        totalRuns: 3,
        viewSec: 15,
        pauseSec: 3,
        scrollDirection: "none", // "none" | "down" | "up"
        scrollSpeed: "medium",
        scrollStatusText: "Idle",
        scrollStatusColor: "#94a3b8",
        autoNext: true,
        phase: "idle", // idle | loading | viewing | cooldown | blocked | completed | stopped
        phaseRemaining: 0,
        activeUrl: "",
        timerId: null,
        loadTimeoutId: null,
        scrollRafId: null,
        lastFrameTime: 0,
        subPixelCarry: 0
      };

      function validateUrl(raw) {
        const trimmed = (raw || "").trim();
        if (!trimmed) return { valid: false, error: "Enter a website URL to start testing." };
        if (/\s/.test(trimmed)) return { valid: false, error: "URL cannot contain spaces." };
        if (!/^https?:\/\//i.test(trimmed)) {
          return { valid: false, error: "URL must start with http:// or https://" };
        }
        try {
          const parsed = new URL(trimmed);
          if (parsed.protocol !== "http:" && parsed.protocol !== "https:") {
            return { valid: false, error: "Only HTTP and HTTPS protocols are supported." };
          }
          if (!parsed.hostname) return { valid: false, error: "Enter a valid website host." };
          return { valid: true, url: parsed.toString() };
        } catch {
          return { valid: false, error: "Enter a valid HTTP or HTTPS web address." };
        }
      }

      function clampInt(val, min, max, fallback) {
        const n = parseInt(val, 10);
        if (Number.isNaN(n)) return fallback;
        return Math.min(max, Math.max(min, n));
      }

      function formatTimer(sec) {
        const s = Math.max(0, Math.floor(sec));
        return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
      }

      function showOverlay(title, desc, showOpen = false) {
        previewFrame.style.display = "none";
        previewOverlay.style.display = "flex";
        overlayTitle.textContent = title;
        overlayDesc.textContent = desc;
        overlayOpenBtn.style.display = showOpen ? "inline-flex" : "none";
      }

      function showIframe() {
        previewOverlay.style.display = "none";
        previewFrame.style.display = "block";
      }

      function syncExternalLinks(url) {
        const check = validateUrl(url);
        const safeHref = check.valid ? check.url : "about:blank";
        headerOpenBtn.href = safeHref;
        overlayOpenBtn.href = safeHref;
      }

      function setScrollStatus(text, color) {
        session.scrollStatusText = text;
        session.scrollStatusColor = color;
        scrollStatusBadge.textContent = text;
        scrollStatusBadge.style.color = color;
        scrollStatusBadge.style.borderColor = color;
      }

      // Safely check same-origin iframe document access without bypassing security restrictions
      function getAccessibleIframeDocument() {
        try {
          if (!previewFrame || previewFrame.style.display === "none") return null;
          const win = previewFrame.contentWindow;
          const doc = previewFrame.contentDocument || (win ? win.document : null);
          if (!doc) return null;
          // Accessing location.href throws SecurityError on cross-origin iframes
          const href = doc.location && doc.location.href;
          if (!href || href === "about:blank") return null;
          return { doc, win };
        } catch {
          return null;
        }
      }

      // Detect the actual scrollable container inside the previewed page
      function findScrollableContainer(doc, direction) {
        const win = doc.defaultView || previewFrame.contentWindow;
        const root = doc.scrollingElement || doc.documentElement || doc.body;
        const candidates = [];

        if (root && root.scrollHeight > root.clientHeight + 2) {
          candidates.push(root);
        }

        const elements = doc.querySelectorAll("*");
        const limit = Math.min(elements.length, 600);
        for (let i = 0; i < limit; i++) {
          const el = elements[i];
          if (el === root) continue;
          const style = win ? win.getComputedStyle(el) : null;
          if (!style) continue;
          const oy = style.overflowY;
          if ((oy === "auto" || oy === "scroll") && el.scrollHeight > el.clientHeight + 4) {
            candidates.push(el);
          }
        }

        if (direction === "up") {
          for (let i = 0; i < candidates.length; i++) {
            if (candidates[i].scrollTop > 0) return candidates[i];
          }
        } else {
          for (let i = 0; i < candidates.length; i++) {
            const c = candidates[i];
            if (c.scrollTop + c.clientHeight < c.scrollHeight - 1) return c;
          }
        }

        return candidates.length > 0 ? candidates[0] : root;
      }

      function stopScrolling(reasonText = "Stopped", color = "#fbbf24") {
        if (session.scrollRafId !== null) {
          cancelAnimationFrame(session.scrollRafId);
          session.scrollRafId = null;
        }
        session.scrollDirection = "none";
        session.lastFrameTime = 0;
        session.subPixelCarry = 0;
        setScrollStatus(reasonText, color);
        updateUI();
      }

      function runScrollAnimationFrame(timestamp) {
        if (session.scrollDirection === "none") {
          session.scrollRafId = null;
          return;
        }

        const access = getAccessibleIframeDocument();
        if (!access) {
          // Cross-origin or unavailable iframe: stop cleanly and do NOT scroll the outer app page
          stopScrolling("Cross-Origin Restricted", "#fb7185");
          return;
        }

        const { doc } = access;
        const target = findScrollableContainer(doc, session.scrollDirection);
        if (!target) {
          stopScrolling("No Scrollable Container", "#fbbf24");
          return;
        }

        if (!session.lastFrameTime) {
          session.lastFrameTime = timestamp;
        }
        const dtSec = Math.min(0.05, Math.max(0, (timestamp - session.lastFrameTime) / 1000));
        session.lastFrameTime = timestamp;

        const speed = SPEED_PX_PER_SEC[session.scrollSpeed] || 160;
        session.subPixelCarry += speed * dtSec;
        const stepPx = Math.floor(session.subPixelCarry);
        if (stepPx >= 1) {
          session.subPixelCarry -= stepPx;

          if (session.scrollDirection === "up") {
            if (target.scrollTop <= 0) {
              stopScrolling("Reached Top", "#fbbf24");
              return;
            }
            target.scrollTop = Math.max(0, target.scrollTop - stepPx);
            if (target.scrollTop <= 0) {
              stopScrolling("Reached Top", "#fbbf24");
              return;
            }
          } else if (session.scrollDirection === "down") {
            const maxScroll = target.scrollHeight - target.clientHeight;
            if (maxScroll <= 0 || target.scrollTop >= maxScroll - 1) {
              stopScrolling("Reached Bottom", "#fbbf24");
              return;
            }
            target.scrollTop = Math.min(maxScroll, target.scrollTop + stepPx);
            if (target.scrollTop >= maxScroll - 1) {
              stopScrolling("Reached Bottom", "#fbbf24");
              return;
            }
          }
        }

        session.scrollRafId = requestAnimationFrame(runScrollAnimationFrame);
      }

      function startScrolling(direction) {
        if (session.scrollRafId !== null) {
          cancelAnimationFrame(session.scrollRafId);
          session.scrollRafId = null;
        }

        const access = getAccessibleIframeDocument();
        if (!access) {
          session.scrollDirection = "none";
          if (previewFrame.style.display === "block") {
            setScrollStatus("Cross-Origin Restricted", "#fb7185");
          } else {
            setScrollStatus("Load Preview First", "#fbbf24");
          }
          updateUI();
          return;
        }

        session.scrollDirection = direction;
        session.lastFrameTime = 0;
        session.subPixelCarry = 0;

        if (direction === "up") {
          setScrollStatus(`Scrolling Up (${session.scrollSpeed})`, "#a855f7");
        } else {
          setScrollStatus(`Scrolling Down (${session.scrollSpeed})`, "#38bdf8");
        }
        updateUI();
        session.scrollRafId = requestAnimationFrame(runScrollAnimationFrame);
      }

      function updateUI() {
        const labels = {
          idle: ["Idle", "#38bdf8"],
          loading: ["Loading", "#38bdf8"],
          viewing: ["Viewing", "#34d399"],
          cooldown: ["Pausing", "#fbbf24"],
          blocked: ["Restricted", "#fb7185"],
          completed: ["Completed", "#34d399"],
          stopped: ["Stopped", "#fbbf24"]
        };
        const [label, color] = labels[session.phase] || ["Idle", "#38bdf8"];
        statusText.textContent = session.running ? `${label} • ${formatTimer(session.phaseRemaining)}` : label;
        statusDot.style.background = color;
        statusDot.style.boxShadow = `0 0 10px ${color}`;

        liveStatusLabel.textContent = session.running
          ? `${label} • Run ${session.currentRun}/${session.totalRuns}`
          : `Live Status: ${label}`;

        const pct = session.phase === "completed"
          ? 100
          : (session.running && session.totalRuns > 0
            ? Math.round(((session.currentRun - 1) / session.totalRuns) * 100)
            : 0);
        progressPercentLabel.textContent = `${pct}%`;
        progressFill.style.width = `${pct}%`;

        urlInput.disabled = session.running;
        btnHttps.disabled = session.running;
        btnHttp.disabled = session.running;
        viewSecInput.disabled = session.running;
        pauseSecInput.disabled = session.running;
        runsInput.disabled = session.running || !session.autoNext;
        autoNextToggle.disabled = session.running;
        startBtn.disabled = session.running;
        stopBtn.disabled = !session.running;

        scrollDownBtn.classList.toggle("active", session.scrollDirection === "down");
        scrollUpBtn.classList.toggle("active", session.scrollDirection === "up");
        scrollDownBtn.disabled = session.scrollDirection === "down";
        scrollUpBtn.disabled = session.scrollDirection === "up";
        stopScrollBtn.disabled = session.scrollDirection === "none";

        const hasActive = Boolean(session.activeUrl) && session.phase !== "blocked";
        backBtn.disabled = !hasActive;
        homeBtn.disabled = !session.activeUrl;
        reloadBtn.disabled = !hasActive;
      }

      function clearTemporarySession(nextPhase) {
        if (session.timerId) clearInterval(session.timerId);
        if (session.loadTimeoutId) clearTimeout(session.loadTimeoutId);
        session.timerId = null;
        session.loadTimeoutId = null;
        session.running = false;
        session.currentRun = 0;
        session.phaseRemaining = 0;
        session.activeUrl = "";
        session.phase = nextPhase;
        stopScrolling(nextPhase === "idle" ? "Idle" : "Stopped", nextPhase === "idle" ? "#94a3b8" : "#fbbf24");
        previewFrame.src = "about:blank";
        syncExternalLinks(urlInput.value);
        updateUI();
      }

      function beginRun(runNumber) {
        session.currentRun = runNumber;
        session.phase = "loading";
        session.phaseRemaining = session.viewSec;
        syncExternalLinks(session.activeUrl);
        updateUI();
        showOverlay("Loading Embedded Preview...", `Run ${runNumber} of ${session.totalRuns}`, false);

        previewFrame.src = "about:blank";
        setTimeout(() => {
          if (!session.running) return;
          previewFrame.src = session.activeUrl;
        }, 50);

        let loaded = false;
        previewFrame.onload = () => {
          if (!session.running || previewFrame.src === "about:blank") return;
          loaded = true;
          clearTimeout(session.loadTimeoutId);
          session.phase = "viewing";
          showIframe();
          if (session.scrollDirection !== "none") {
            startScrolling(session.scrollDirection);
          }
          updateUI();
        };

        previewFrame.onerror = () => {
          clearTemporarySession("blocked");
          setScrollStatus("Cross-Origin Restricted", "#fb7185");
          showOverlay("Embedded Preview Restricted", "This site restricts embedded loading. Open it directly in your browser without bypassing site security.", true);
        };

        session.loadTimeoutId = setTimeout(() => {
          if (!loaded && session.running) {
            session.phase = "viewing";
            showIframe();
            if (session.scrollDirection !== "none") {
              startScrolling(session.scrollDirection);
            }
            updateUI();
          }
        }, 4000);
      }

      function tick() {
        if (!session.running) return;

        if (session.phase === "loading" || session.phase === "viewing") {
          if (session.phaseRemaining > 1) {
            session.phaseRemaining -= 1;
            updateUI();
          } else {
            stopScrolling("Idle", "#94a3b8");
            if (session.currentRun < session.totalRuns && session.autoNext) {
              if (session.pauseSec > 0) {
                session.phase = "cooldown";
                session.phaseRemaining = session.pauseSec;
                previewFrame.src = "about:blank";
                showOverlay("Pause Interval", `${session.pauseSec}s before next test`, false);
                updateUI();
              } else {
                beginRun(session.currentRun + 1);
              }
            } else {
              clearTemporarySession("completed");
              showOverlay("Testing Completed", "Temporary session data cleared.", false);
            }
          }
        } else if (session.phase === "cooldown") {
          if (session.phaseRemaining > 1) {
            session.phaseRemaining -= 1;
            overlayDesc.textContent = `${session.phaseRemaining}s before next test`;
            updateUI();
          } else {
            beginRun(session.currentRun + 1);
          }
        }
      }

      urlInput.addEventListener("input", () => {
        const lower = urlInput.value.trim().toLowerCase();
        btnHttps.classList.toggle("active", !lower.startsWith("http://"));
        btnHttp.classList.toggle("active", lower.startsWith("http://"));
        const check = validateUrl(urlInput.value);
        urlError.textContent = urlInput.value.trim() && !check.valid ? check.error : "";
        syncExternalLinks(urlInput.value);
      });

      btnHttps.addEventListener("click", () => {
        urlInput.value = "https://" + urlInput.value.trim().replace(/^https?:\/\//i, "");
        urlInput.dispatchEvent(new Event("input"));
      });

      btnHttp.addEventListener("click", () => {
        urlInput.value = "http://" + urlInput.value.trim().replace(/^https?:\/\//i, "");
        urlInput.dispatchEvent(new Event("input"));
      });

      scrollDownBtn.addEventListener("click", () => startScrolling("down"));
      scrollUpBtn.addEventListener("click", () => startScrolling("up"));
      stopScrollBtn.addEventListener("click", () => stopScrolling("Stopped", "#fbbf24"));

      scrollSpeedRow.querySelectorAll("button[data-speed]").forEach((btn) => {
        btn.addEventListener("click", () => {
          session.scrollSpeed = btn.getAttribute("data-speed") || "medium";
          scrollSpeedRow.querySelectorAll("button[data-speed]").forEach((b) => {
            b.classList.toggle("active", b === btn);
          });
          if (session.scrollDirection === "up") {
            setScrollStatus(`Scrolling Up (${session.scrollSpeed})`, "#a855f7");
          } else if (session.scrollDirection === "down") {
            setScrollStatus(`Scrolling Down (${session.scrollSpeed})`, "#38bdf8");
          }
        });
      });

      autoNextToggle.addEventListener("change", () => {
        session.autoNext = autoNextToggle.checked;
        updateUI();
      });

      startBtn.addEventListener("click", () => {
        const check = validateUrl(urlInput.value);
        if (!check.valid) {
          urlError.textContent = check.error;
          return;
        }
        urlError.textContent = "";
        urlInput.value = check.url;

        session.viewSec = clampInt(viewSecInput.value, 3, 300, 15);
        session.pauseSec = clampInt(pauseSecInput.value, 0, 120, 3);
        session.autoNext = autoNextToggle.checked;
        session.totalRuns = session.autoNext ? clampInt(runsInput.value, 1, 50, 3) : 1;
        session.running = true;
        session.activeUrl = check.url;

        beginRun(1);
        session.timerId = setInterval(tick, 1000);
      });

      stopBtn.addEventListener("click", () => {
        if (!session.running) return;
        clearTemporarySession("stopped");
        showOverlay("Session Stopped & Cleared", "Enter an HTTP or HTTPS URL and tap Start.", false);
      });

      backBtn.addEventListener("click", () => {
        const access = getAccessibleIframeDocument();
        if (access && access.win) {
          access.win.history.back();
        }
      });

      homeBtn.addEventListener("click", () => {
        if (session.activeUrl) previewFrame.src = session.activeUrl;
      });

      reloadBtn.addEventListener("click", () => {
        if (session.activeUrl) previewFrame.src = previewFrame.src;
      });

      window.addEventListener("beforeunload", () => {
        clearTemporarySession("idle");
      });

      updateUI();
    })();
  </script>
</body>
</html>
